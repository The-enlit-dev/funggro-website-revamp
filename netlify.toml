# Evaluation deployment of the Funngro two-page redesign.
# DEPLOY_TARGET defaults to "evaluation": pages get <meta name="robots" content="noindex, nofollow">,
# and an X-Robots-Tag header (generated into dist/_headers). robots.txt allows crawling so the noindex can be read.
# To build the indexable version for www.funngro.com, set DEPLOY_TARGET=production (see DEPLOYMENT.md).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  DEPLOY_TARGET = "evaluation"
